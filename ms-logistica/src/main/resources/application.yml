server:
  port: 8082

spring:
  application:
    name: ms-logistica
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3307/bd_logistica}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/logistica}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/logistica/protocol/openid-connect/certs}


app:
  ms-paquetes:
    base-url: ${MS_PAQUETES_URL:http://localhost:8081}
  osrm:
    base-url: ${OSRM_URL:http://localhost:5000}

management:
  endpoints:
    web:
      exposure:
        include: health,info