server:
  port: 8082

spring:
  application:
    name: ms-logistica
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3308/bd_logistica}
    username: ${LOGISTICA_DB_USER}
    password: ${LOGISTICA_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/logistica}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/logistica/protocol/openid-connect/certs}
      client:
        registration:
          ms-paquetes:
            provider: keycloak
            client-id: ${MS_PAQUETES_CLIENT_ID:ms-logistica-service}
            client-secret: ${MS_PAQUETES_CLIENT_SECRET}
            authorization-grant-type: client_credentials
        provider:
          keycloak:
            token-uri: ${KEYCLOAK_TOKEN_URI:http://localhost:8180/realms/logistica/protocol/openid-connect/token}


app:
  ms-paquetes:
    base-url: ${MS_PAQUETES_URL:http://localhost:8081}
  osrm:
    base-url: ${OSRM_URL:http://localhost:5000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
