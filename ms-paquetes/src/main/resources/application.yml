server:
  port: 8081

spring:
  application:
    name: ms-paquetes
  datasource:
    url: ${DB_URL:jdbc:mariadb://127.0.0.1:3307/bd_paquetes}
    username: ${PAQUETES_DB_USER}
    password: ${PAQUETES_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/logistica}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/logistica/protocol/openid-connect/certs}


management:
  endpoints:
    web:
      exposure:
        include: health,info
