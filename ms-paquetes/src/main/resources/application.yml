server:
  port: 8081

spring:
  application:
    name: ms-paquetes
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3307/bd_paquetes}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info