spring:
  datasource:
    url: jdbc:h2:mem:paquetes-test;MODE=MariaDB;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost/realms/test
          jwk-set-uri: http://localhost/realms/test/certs
