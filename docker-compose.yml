services:
  paquetes-db:
    image: mariadb:11.8
    restart: unless-stopped
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MARIADB_ROOT_PASSWORD: ${PAQUETES_DB_ROOT_PASSWORD}
      MARIADB_DATABASE: bd_paquetes
      MARIADB_USER: ${PAQUETES_DB_USER}
      MARIADB_PASSWORD: ${PAQUETES_DB_PASSWORD}
    volumes:
      - paquetes-db-data:/var/lib/mysql
    networks:
      - paquetes-db-net
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  logistica-db:
    image: mariadb:11.8
    restart: unless-stopped
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MARIADB_ROOT_PASSWORD: ${LOGISTICA_DB_ROOT_PASSWORD}
      MARIADB_DATABASE: bd_logistica
      MARIADB_USER: ${LOGISTICA_DB_USER}
      MARIADB_PASSWORD: ${LOGISTICA_DB_PASSWORD}
    volumes:
      - logistica-db-data:/var/lib/mysql
      - ./infra/mariadb/logistica-init:/docker-entrypoint-initdb.d:ro
    networks:
      - logistica-db-net
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    container_name: keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
      KC_DB: mariadb
      KC_DB_URL: jdbc:mariadb://logistica-db:3306/bd_keycloak
      KC_DB_USERNAME: ${LOGISTICA_DB_USER}
      KC_DB_PASSWORD: ${LOGISTICA_DB_PASSWORD}
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro
    depends_on:
      logistica-db:
        condition: service_healthy
    networks:
      - logistica-net
      - logistica-db-net

  ms-paquetes:
    build:
      context: ./ms-paquetes
      dockerfile: Dockerfile
    container_name: ms-paquetes
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:mariadb://paquetes-db:3306/bd_paquetes
      SPRING_DATASOURCE_USERNAME: ${PAQUETES_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${PAQUETES_DB_PASSWORD}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.mariadb.jdbc.Driver
      KEYCLOAK_ISSUER_URI: http://localhost:8180/realms/logistica
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/logistica/protocol/openid-connect/certs
    depends_on:
      paquetes-db:
        condition: service_healthy
    networks:
      - logistica-net
      - paquetes-db-net

  ms-logistica:
    build:
      context: ./ms-logistica
      dockerfile: Dockerfile
    container_name: ms-logistica
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:mariadb://logistica-db:3306/bd_logistica
      SPRING_DATASOURCE_USERNAME: ${LOGISTICA_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${LOGISTICA_DB_PASSWORD}
      MS_PAQUETES_URL: http://ms-paquetes:8081
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.mariadb.jdbc.Driver
      KEYCLOAK_ISSUER_URI: http://localhost:8180/realms/logistica
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/logistica/protocol/openid-connect/certs
      KEYCLOAK_TOKEN_URI: http://keycloak:8080/realms/logistica/protocol/openid-connect/token
      MS_PAQUETES_CLIENT_ID: ${MS_PAQUETES_CLIENT_ID:-ms-logistica-service}
      MS_PAQUETES_CLIENT_SECRET: ${MS_PAQUETES_CLIENT_SECRET:?Falta MS_PAQUETES_CLIENT_SECRET en .env}
      OSRM_URL: http://osrm:5000
    depends_on:
      logistica-db:
        condition: service_healthy
      ms-paquetes:
        condition: service_started
      keycloak:
        condition: service_started
      osrm:
        condition: service_started
        required: false
    networks:
      - logistica-net
      - logistica-db-net

  # Cálculo de rutas. Requiere los datos generados con ms-logistica/osrm/prepare.ps1
  # y se levanta solo con --profile osrm, para que `docker compose up` siga
  # funcionando en equipos que no tienen el mapa descargado.
  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v6.0.0
    container_name: osrm
    restart: unless-stopped
    command: osrm-routed --algorithm mld /data/cordoba.osrm
    volumes:
      - ./ms-logistica/osrm/data:/data
    profiles: ["osrm"]
    networks:
      - logistica-net

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    restart: unless-stopped
    environment:
      KEYCLOAK_ISSUER_URI: http://localhost:8180/realms/logistica
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/logistica/protocol/openid-connect/certs
      MS_PAQUETES_URL: http://ms-paquetes:8081
      MS_LOGISTICA_URL: http://ms-logistica:8082
    depends_on:
      - ms-paquetes
      - ms-logistica
      - keycloak
    networks:
      - logistica-net

networks:
  logistica-net:
    driver: bridge

  paquetes-db-net:
    driver: bridge
  logistica-db-net:
    driver: bridge

volumes:
  paquetes-db-data:
  logistica-db-data:
