services:
  mariadb-db:
    image: mariadb:11.8
    container_name: mariadb-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: bd_paquetes
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mariadb-logistica-data:/var/lib/mysql
      - ./infra/mariadb/init:/docker-entrypoint-initdb.d:ro
    networks:
      - logistica-net
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    container_name: keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
      KC_DB: mariadb
      KC_DB_URL: jdbc:mariadb://mariadb-db:3306/bd_keycloak
      KC_DB_USERNAME: ${DB_USER}
      KC_DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro
    depends_on:
      mariadb-db:
        condition: service_healthy
    networks:
      - logistica-net

  ms-paquetes:
    build:
      context: ./ms-paquetes
      dockerfile: Dockerfile
    container_name: ms-paquetes
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb-db:3306/bd_paquetes
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.mariadb.jdbc.Driver
      KEYCLOAK_ISSUER_URI: http://localhost:8180/realms/logistica
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/logistica/protocol/openid-connect/certs
    depends_on:
      mariadb-db:
        condition: service_healthy
    networks:
      - logistica-net

  ms-logistica:
    build:
      context: ./ms-logistica
      dockerfile: Dockerfile
    container_name: ms-logistica
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb-db:3306/bd_logistica
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      MS_PAQUETES_URL: http://ms-paquetes:8081
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.mariadb.jdbc.Driver
      KEYCLOAK_ISSUER_URI: http://localhost:8180/realms/logistica
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/logistica/protocol/openid-connect/certs
    depends_on:
      mariadb-db:
        condition: service_healthy
      ms-paquetes:
        condition: service_started
    networks:
      - logistica-net

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    restart: unless-stopped
    environment:
      KEYCLOAK_ISSUER_URI: http://localhost:8180/realms/logistica
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/logistica/protocol/openid-connect/certs
      MS_PAQUETES_URL: http://ms-paquetes:8081
      MS_LOGISTICA_URL: http://ms-logistica:8082
    depends_on:
      - ms-paquetes
      - ms-logistica
      - keycloak
    networks:
      - logistica-net

networks:
  logistica-net:
    driver: bridge

volumes:
  mariadb-logistica-data:
