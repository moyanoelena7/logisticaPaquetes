server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: ms-paquetes
              uri: ${MS_PAQUETES_URL:http://localhost:8081}
              predicates:
                - Path=/paquetes/**, /clientes/**, /vehiculos/**, /repartidores/**, /sucursales/**
            - id: ms-logistica
              uri: ${MS_LOGISTICA_URL:http://localhost:8082}
              predicates:
                - Path=/envios/**
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/logistica}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/logistica/protocol/openid-connect/certs}

management:
  endpoints:
    web:
      exposure:
        include: health,info
